name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags=golden

  golden:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --tags=golden

  benchmark:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tool/benchmarks/amortization_benchmark.dart

  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: [tests, golden, benchmark]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Determine Version
        id: version
        run: |
          RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r' | tr -d ' ')
          BASE_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1 | cut -d'-' -f1)
          MAJOR=$(echo "$BASE_VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f2)
          BUILD_NUM=${{ github.run_number }}
          RELEASE_VERSION="${MAJOR}.${MINOR}.${BUILD_NUM}"
          TAG="v${RELEASE_VERSION}"
          echo "Building Release ${RELEASE_VERSION} (tag: ${TAG}, build: ${BUILD_NUM})"
          echo "version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_num }}

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes
